# sdl2-config.ini
# SDL2 Configuration for Miitalkmo TTS Application
# This config is used by Citra emulator and standalone SDL2 apps

[General]
# Window settings
fullscreen=false
width=1280
height=720
vsync=true
use_vsync=true
use_frame_limiting=true
frame_limit=60

# Audio settings
[Audio]
enabled=true
output_format=16
sample_rate=16000
buffer_size=2048
channels=1
use_surround=false
volume=100

# Input/Joystick
[Input]
enabled=true
map_analog_to_dpad=false
motion_device=
touch_device=

# Graphics/Rendering
[Graphics]
use_hardware_renderer=true
use_shader_jit=false
use_accurate_multiplication=false
resolution_factor=1
texture_filter=Nearest
texture_sampling=Default
use_fast_gpu_time=false

# Core settings
[Core]
use_cpu_jit=true
use_multi_core=true
cpu_clock_percentage=100

# System
[System]
region=2
language=1
use_system_clock=true

# Debugging (optional)
[Debug]
use_gdbstub=false
gdbstub_port=24689
use_telemetry=false
log_filter=*:Info

# Network settings (if needed for TTS API communication)
[Network]
enable_slipstream=false
slipstream_port=24680
